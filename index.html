<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Master Syllabus</title>
 <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0c111b">
<style>
:root{color-scheme:dark;--bg:#0c111b;--panel:#141d2b;--panel2:#192638;--line:#2d3b50;--text:#edf1f6;--muted:#aab5c3;--accent:#a9bfd9;--green:#9ac7a9;--gold:#d7c89e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI",Arial,sans-serif}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#101927;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-size:17px;font-weight:750;letter-spacing:.7px}.brand span{color:var(--accent);font-weight:500}
.header-meta{font-size:12px;color:var(--muted)}
main{max-width:1500px;margin:auto;padding:25px 30px 70px}
.pagehead{margin-bottom:20px}.pagehead h1{font-size:27px;margin:0 0 5px;font-weight:750}.pagehead p{margin:0;color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:9px;align-items:center;margin:18px 0 24px}.toolbar input{width:min(450px,100%);padding:11px 13px;background:#111c2b;border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit}.toolbar button{padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:#182538;color:var(--text);cursor:pointer}
.part{margin:30px 0 45px}.part-title{font-size:50px;line-height:1.15;font-weight:850;letter-spacing:.4px;padding:0 0 14px;margin:0 0 18px;border-bottom:3px solid #52647a;color:#f1f4f8}
.chapter{margin:17px 0 22px;border:1px solid var(--line);border-radius:9px;background:#111a28;overflow:hidden}
.chapter-title{font-size:35px;line-height:1.2;font-weight:800;padding:15px 18px;background:#1a293c;border-bottom:1px solid #3a4b61}
.topic{padding:11px 15px;border-bottom:1px solid #29374a}.topic:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:14px;min-height:32px}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.topic-title{font-size:24px;font-weight:700;line-height:1.3}
.leaf-title{font-size:16px;font-weight:450;color:#dce3ec}
.number{color:#a9bfd9;font-weight:750;font-variant-numeric:tabular-nums;margin-right:10px;white-space:nowrap}
.controls{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex:0 0 auto}
.checks{display:flex;align-items:center;gap:12px}
.checks label{display:flex;align-items:center;gap:5px;color:#bdc7d3;font-size:12px;white-space:nowrap;cursor:pointer}
.checks input{width:15px;height:15px;margin:0;accent-color:var(--green);cursor:pointer}
.notes-btn{font-size:12px;padding:6px 9px;background:#202f43;border:1px solid #40516a;border-radius:7px;color:#e0e8f1;white-space:nowrap;cursor:pointer}
.notes-btn:hover{border-color:#9bb3d0}
.children{margin:9px 0 0 18px;padding-left:14px;border-left:1px solid #40516a}
.topic[data-depth="1"]{background:#121d2c}.topic[data-depth="2"]{background:#111b29}.topic[data-depth="3"]{background:#101a28}
.topic[data-depth="4"]{background:#0f1926}
.hidden{display:none!important}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}
.dialog{width:min(620px,100%);max-height:88vh;overflow:auto;background:#172235;border:1px solid #43536b;border-radius:12px;padding:19px;box-shadow:0 20px 70px #0009}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.dialog h2{font-size:19px;margin:0 0 4px}.dialog p{font-size:13px;color:var(--muted);margin:0 0 14px}
.dialog button{padding:8px 11px;background:#22334a;border:1px solid #465a75;border-radius:7px;color:var(--text);cursor:pointer}
.upload{border:1px dashed #586b84;border-radius:9px;padding:12px;margin:13px 0}.upload input{max-width:100%}
.file-list{display:grid;gap:7px;margin-top:12px}.file-row{display:flex;align-items:center;gap:9px;justify-content:space-between;background:#101a29;border:1px solid #34465e;border-radius:8px;padding:9px 10px;font-size:13px}.file-name{overflow-wrap:anywhere;min-width:0;flex:1}.file-actions{display:flex;gap:6px;flex-shrink:0}.file-actions button{font-size:12px;padding:5px 8px}.empty{color:var(--muted);font-size:13px;padding:12px 0}
@media(max-width:900px){main{padding:18px 14px 50px}.part-title{font-size:clamp(28px,7vw,50px)}.chapter-title{font-size:clamp(23px,5vw,35px)}.row{flex-wrap:wrap;gap:8px}.name{flex-basis:100%}.controls{width:100%;justify-content:flex-start;padding-left:2px}.children{margin-left:6px;padding-left:8px}.topic-title{font-size:20px}}
@media print{body{background:white;color:#111}header,.toolbar,.controls,.notes-btn{display:none!important}main{padding:0}.part-title{font-size:30px;color:#111;border-color:#777}.chapter,.chapter-title,.topic{background:white;color:#111;border-color:#aaa}.chapter-title{font-size:24px}.topic-title{font-size:17px}.leaf-title{font-size:12px;color:#111}.number{color:#333}.part{break-before:page}.chapter{break-inside:avoid}}
</style>
<style>
/* Refined, compact interface */
header{display:none!important}
main{padding-top:20px}
.pagehead{margin:0 0 18px}
.pagehead h1{font-size:25px;letter-spacing:.1px}
.pagehead p{display:none}
.dialog-head p{display:none}
.upload{border:1px solid var(--line);border-radius:9px;background:#111b29;padding:12px;margin:14px 0}
.choose-files{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border:1px solid #526781;border-radius:8px;background:#21334a;color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.selected-names{font-size:12px;color:var(--muted);margin:8px 0}
.primary-action{display:block;margin-top:10px;background:#dce6f1!important;color:#142033!important;border:0!important;font-weight:700}
.saved-heading{font-size:14px;font-weight:700;margin:18px 0 8px;color:#e5ebf2}
.file-row{background:#111b29}
.viewer{display:none;position:fixed;inset:0;z-index:40;background:#080d15;flex-direction:column}
.viewer.show{display:flex}
.viewer-bar{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#142033;border-bottom:1px solid #34445a;gap:12px}
#viewerName{font-size:13px;font-weight:650;overflow-wrap:anywhere}
.viewer-bar button{background:#263951;border:1px solid #536780;color:white;border-radius:7px;padding:7px 12px}
.viewer-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.viewer-body img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-body iframe{width:100%;height:100%;border:0;background:white}
.viewer-note{padding:24px;color:#d6deea;text-align:center;max-width:480px;line-height:1.6}
@media(max-width:700px){main{padding:16px 12px 45px}.pagehead h1{font-size:23px}.dialog{padding:16px}.choose-files{width:100%}}
</style>
</head>

function blobToBase64Chunk(blob){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(blob);
 });
}
async function openThroughAndroidBridge(file,mime){
 const bridge=window.AndroidBridge;
 if(!bridge || typeof bridge.beginFileTransfer!=='function' ||
    typeof bridge.appendFileChunk!=='function' ||
    typeof bridge.finishFileTransfer!=='function') return false;
 const chunkSize=256*1024;
 try{
  bridge.beginFileTransfer(file.name,mime,file.blob.size);
  for(let offset=0;offset<file.blob.size;offset+=chunkSize){
   const part=file.blob.slice(offset,Math.min(offset+chunkSize,file.blob.size));
   bridge.appendFileChunk(await blobToBase64Chunk(part));
  }
  bridge.finishFileTransfer();
  return true;
 }catch(err){
  try{if(typeof bridge.cancelFileTransfer==='function')bridge.cancelFileTransfer();}catch(_){}
  alert('The Android file opener could not open this file. Please check the app integration.');
  return true;
 }
}

   $('viewerName').textContent=f.name;
   $('viewerBody').innerHTML=`<img src="${activeObjectUrl}" alt="${esc(f.name)}">`;
   $('fileViewer').classList.add('show');
  }else{
   const a=document.createElement('a');
   a.href=activeObjectUrl;a.download=f.name;a.style.display='none';
   document.body.appendChild(a);a.click();a.remove();
   alert(ext==='pdf'
    ? 'PDF downloaded. Open it from your Downloads folder in a PDF viewer.'
    : 'Presentation downloaded. Open it from Downloads in PowerPoint or a compatible app.');
   setTimeout(()=>{if(activeObjectUrl){URL.revokeObjectURL(activeObjectUrl);activeObjectUrl=null;}},120000);
  }
 }
 if(d){await removeFile(d.dataset.deletefile);refreshFiles()}
});
$('fileInput').addEventListener('change',()=>{$('selectedNames').textContent=[...$('fileInput').files].map(f=>f.name).join(' · ')});
$('closeModal').onclick=()=>{$('notesModal').classList.remove('show');closeFileViewer()};
$('search').addEventListener('input',e=>{let q=e.target.value.trim().toLowerCase();document.querySelectorAll('.topic').forEach(el=>el.classList.toggle('hidden',!!q&&!el.dataset.search.includes(q)));document.querySelectorAll('.chapter').forEach(el=>el.classList.toggle('hidden',!!q&&!el.querySelector('.topic:not(.hidden)')&&!el.dataset.search.includes(q)));document.querySelectorAll('.part').forEach(el=>el.classList.toggle('hidden',!!q&&!el.querySelector('.chapter:not(.hidden)')))});
$('clearSearch').onclick=()=>{$('search').value='';document.querySelectorAll('.hidden').forEach(x=>x.classList.remove('hidden'))};
(async()=>{await openDB();render()})();
</script></body></html>
